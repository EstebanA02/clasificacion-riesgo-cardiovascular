[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Esteban", email = "estebanarango02@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "joblib>=1.6.0",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
    "xgboost>=3.4.1",
]

[project.scripts]
app = "app:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
]
